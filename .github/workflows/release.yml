name: Release

# Publishing is deliberately manual and tag-driven. A package three sites depend
# on should not reach npm because somebody merged to main.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. action-setup refuses outright when a
      # version is given AND package.json has `packageManager`, which it does;
      # that field is the single source of truth for the pnpm version.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # The same gates CI runs. A tag skips nothing.
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Refuse a tag that disagrees with package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json $pkg" >&2
            exit 1
          fi

      - name: Publish
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
